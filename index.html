<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sayı Bahçesi">
<meta name="theme-color" content="#9ADCF8">
<title>Sayı Bahçesi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/baloo2-800.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="home" class="screen active">
    <header class="top">
      <div class="wallet">
        <span class="wchip" style="--c:#E5483B" id="wTicketChip">🎟️ <b id="wTickets">0</b><small>/3</small></span>
        <span class="wchip" style="--c:#F5A524">🪙 <b id="wCoins">0</b></span>
        <span class="wchip" style="--c:#34C17B"><span class="star">★</span> <b id="wStars">0</b></span>
      </div>
      <button class="icon-btn soft" id="settingsBtn" aria-label="Ayarlar">⚙️</button>
    </header>
    <div class="home-body">
      <button class="hero" id="playBtn">
        <span class="hero-k">Sıradaki tur · 10 soru</span>
        <span class="hero-row">
          <span class="hero-main"><b>Oyna</b><span id="playWhat"></span></span>
          <span class="hero-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5.8v12.4c0 .8.9 1.3 1.6.9l9.4-6.2c.6-.4.6-1.4 0-1.8L10.1 4.9c-.7-.4-1.6.1-1.6.9z"/></svg></span>
        </span>
        <span class="hero-loot"><span>Bitirince:</span><span class="chip" id="lootTicket"></span><span class="chip" id="lootCoins"></span></span>
      </button>
      <div class="home-side">
        <span class="sec-k">Alıştırmalar</span>
        <div class="pracs">
          <button class="prac" data-g="num" style="--c:#3FA9F5;--bg:#E3F2FD"><span class="p-ico">2+3</span><b>Sayılar</b><span class="p-prog"><span class="p-bar"><i></i></span><em></em></span></button>
          <button class="prac" data-g="shape" style="--c:#9B6BEF;--bg:#F0E8FD"><span class="p-ico shape">🔺🔵</span><b>Şekiller</b><span class="p-prog"><span class="p-bar"><i></i></span><em></em></span></button>
          <button class="prac" data-g="en" style="--c:#E5483B;--bg:#FDE7E5"><span class="p-ico">ABC</span><b>İngilizce</b><span class="p-prog"><span class="p-bar"><i></i></span><em></em></span></button>
        </div>
        <button class="task-card" id="tasksBtn"><span class="t-ico">📋<span class="badge" id="taskBadge" hidden>0</span></span><span class="t-txt"><b>Görevlerim</b><small id="taskSub"></small></span><span class="chev" aria-hidden="true">›</span></button>
      </div>
    </div>
  </section>
  <section id="games" class="screen">
    <header class="top">
      <h1>Oyunlar</h1>
      <span class="wchip" style="--c:#F5A524">🪙 <b id="gCoins">0</b></span>
    </header>
    <div class="games-body">
      <div class="ticket-card" id="ticketCard">
        <span class="t-slots" id="tSlots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="t-txt"><b id="tTitle"></b><small id="tSub"></small></span>
        <button class="t-go" id="tGo" hidden>Tur oyna</button>
      </div>
      <div class="game-cards">
        <button class="game-card" id="warBtn" style="--c:#3FA9F5">
          <span class="g-art art-war" aria-hidden="true"><i class="hill"></i><i class="sm1"></i><i class="sm2"></i><i class="arc"></i><i class="ball"></i><i class="cat"></i></span>
          <span class="g-info"><span class="g-txt"><b>Kartopu Savaşı</b><small id="warSub"></small></span><span class="g-cost">🎟️ 1</span></span>
        </button>
        <button class="game-card" id="race3dBtn" style="--c:#0E1220">
          <span class="g-art art-r3d" aria-hidden="true"></span>
          <span class="g-new" id="race3dNew" hidden>yeni</span>
          <span class="g-info"><span class="g-txt"><b>Blok Rallisi 3D</b><small>Gerçek pist, eşya çantası · 6 araba</small></span><span class="g-cost">🎟️ 1</span></span>
        </button>
        <button class="game-card" id="raceBtn" style="--c:#FFC21F">
          <span class="g-art art-race" aria-hidden="true"><i class="hill"></i><i class="road"></i><i class="curb"></i><i class="dash"></i><i class="body"></i><i class="back"></i><i class="drv"></i><i class="w1"></i><i class="w2"></i><i class="sp1"></i><i class="sp2"></i></span>
          <span class="g-new" id="raceNew" hidden>yeni</span>
          <span class="g-info"><span class="g-txt"><b>Blok Rallisi</b><small>Sayı kapısı, turbo · 1 ya da 2 kişi</small></span><span class="g-cost">🎟️ 1</span></span>
        </button>
      </div>
    </div>
  </section>
  <section id="cat" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">‹</button>
      <h1 id="catTitle">Sayılar</h1>
      <span class="top-spacer"></span>
    </header>
    <div class="cat-body">
      <div class="lv-box">
        <span class="lv-k">Zorluk</span>
        <div class="levels" role="radiogroup" aria-label="Zorluk">
          <button class="level" data-level="1" role="radio"><b>Kolay</b><small>0–5</small><span class="lv-dots"><i></i></span></button>
          <button class="level" data-level="2" role="radio"><b>Orta</b><small>0–10</small><span class="lv-dots"><i></i><i></i></span></button>
          <button class="level" data-level="3" role="radio"><b>Zor</b><small>0–20</small><span class="lv-dots"><i></i><i></i><i></i></span></button>
        </div>
      </div>
      <div class="mode-grid" id="catGrid"></div>
      <p class="cat-note">Her tur 10 soru. Bitirince 1 bilet ve yıldız başına 2 altın.</p>
    </div>
  </section>

  <section id="play" class="screen">
    <header class="top">
      <button class="icon-btn" id="homeBtn" aria-label="Ana sayfa">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="tools">
        <button class="icon-btn" id="hintBtn" aria-label="İpucu">💡</button>
        <button class="icon-btn" id="speakBtn" aria-label="Soruyu oku">🔈</button>
      </div>
    </header>
    <div class="stage">
      <div class="question" id="question"></div>
      <div class="prompt" id="prompt"></div>
      <div class="visual" id="visual"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <section id="garden" class="screen">
    <header class="top">
      <button class="icon-btn" id="gardenHomeBtn" aria-label="Ana sayfa">🏠</button>
      <h1 id="gardenTitle">Bahçem</h1>
      <div class="g-tabs" id="gardenTabs"></div>
      <div class="pill" aria-label="Toplam yıldız"><span class="star">★</span> <span id="gardenStars">0</span></div>
    </header>
    <div class="garden-scene" id="gardenScene">
      <div class="garden-sun">☀️</div>
      <div class="g-cloud c1"></div><div class="g-cloud c2"></div><div class="g-cloud c3"></div>
      <div class="g-hill back"></div><div class="g-fence"></div><div class="g-hill front"></div>
      <div class="g-pond"></div>
      <div class="g-aqua" aria-hidden="true"><i class="ray r1"></i><i class="ray r2"></i><i class="ray r3"></i><i class="sand"></i><span class="weed w1">🌿</span><span class="weed w2">🌿</span><span class="weed w3">🌿</span><b class="bub b1"></b><b class="bub b2"></b><b class="bub b3"></b><b class="bub b4"></b><b class="bub b5"></b></div>
      <div class="g-forest" aria-hidden="true"><span>🌲</span><span>🌳</span><span>🌲</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌲</span></div>
      <div class="garden-grid" id="gardenGrid"></div>
      <div class="g-rain" id="gardenRain"></div>
      <div class="garden-next" id="gardenNext"></div>
      <div class="g-water"><span class="g-streak" id="gardenStreak"></span><button class="g-water-btn" id="waterBtn" aria-label="Bahçeyi sula">💧<b>Sula</b></button></div>
      <div class="g-banner" id="gardenBanner" hidden></div>
    </div>
  </section>

  <section id="shop" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Dükkân</h1>
      <div class="pill" aria-label="Altın">🪙 <span id="shopCoins">0</span></div>
    </header>
    <div class="shop-tabs" role="group" aria-label="Hangi oyunun dükkânı">
      <button class="shop-tab on" data-st="war" aria-pressed="true">⛄ Kartopu Savaşı</button>
      <button class="shop-tab" data-st="race" aria-pressed="false">🏎️ Blok Rallisi 3D</button>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
  </section>

  <section id="tasks" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Görevlerim</h1>
      <div class="pill" aria-label="Bilet">🎟️ <span id="tasksTickets">0</span></div>
    </header>
    <div class="task-list" id="taskList"></div>
  </section>

  <section id="parent" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Ebeveyn</h1>
      <span></span>
    </header>
    <div class="parent-body" id="parentBody"></div>
  </section>

  <section id="end" class="screen">
    <div class="end-card">
      <div class="end-stars" id="endStars"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="end-loot" id="endLoot"></div>
      <div class="end-new" id="endNew" hidden></div>
      <div class="end-actions">
        <button class="big-btn" id="againBtn">🔁 Tekrar</button>
        <button class="big-btn alt" id="endHomeBtn">🏠 Ana sayfa</button>
      </div>
    </div>
  </section>
  <nav class="tabbar" id="tabbar" aria-label="Bölümler">
    <button class="tab" data-tab="home" style="--tc:#0F6236;--tb:#E1F6EA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span>Öğren</span></button>
    <button class="tab" data-tab="games" style="--tc:#B5291F;--tb:#FDE7E5"><span class="badge" id="tabTickets" hidden>0</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="17.5" cy="13.5" r="1" fill="currentColor"/></svg><span>Oyunlar</span></button>
    <button class="tab" data-tab="garden" style="--tc:#1F7A45;--tb:#E1F6EA"><span class="t-dot" id="gardenDot" hidden></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M12 5V3M12 13v8M9 8H7M17 8h-2M9.9 5.9L8.5 4.5M15.5 4.5l-1.4 1.4"/><path d="M12 17c-2-2.2-4.5-2.2-6-1 1.5 2.4 4 2.6 6 1zM12 17c2-2.2 4.5-2.2 6-1-1.5 2.4-4 2.6-6 1z"/></svg><span>Bahçem</span></button>
    <button class="tab" data-tab="shop" style="--tc:#9A5A00;--tb:#FEF1DA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.4 10.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8z"/><path d="M8.5 9V7.5a3.5 3.5 0 0 1 7 0V9"/></svg><span>Dükkân</span></button>
  </nav>
</main>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="ver" class="ver" aria-hidden="true"></div>
<div id="cheer" class="cheer"></div>
<div id="confetti"></div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // Yeni sürüm devreye girince bir kez yenile ki bütün dosyalar aynı sürümden gelsin.
    // Tur sürüyorsa yarıda kesme; ana sayfaya ya da sonuç ekranına dönünce yenile.
    const hadController = !!navigator.serviceWorker.controller;
    let pending = false;
    const reloadWhenIdle = () => {
      if (!window.__mg || window.__mg.screen !== 'play') location.reload();
      else setTimeout(reloadWhenIdle, 2000);
    };
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !pending) { pending = true; reloadWhenIdle(); }
    });
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sayı Bahçesi">
<meta name="theme-color" content="#9ADCF8">
<title>Sayı Bahçesi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/baloo2-800.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="home" class="screen active">
    <header class="top">
      <h1>Sayı Bahçesi</h1>
      <div class="tools">
        <div class="pill" aria-label="Toplam yıldız"><span class="star">★</span> <span id="starsTotal">0</span></div>
        <div class="pill" aria-label="Altın">🪙 <span id="coinsTotal">0</span></div>
        <button class="icon-btn" id="parentBtn" aria-label="Ebeveyn paneli">⚙️</button>
        <button class="icon-btn" id="soundBtn" aria-label="Sesi aç / kapat">🔊</button>
      </div>
    </header>
    <div class="levels" role="radiogroup" aria-label="Zorluk">
      <button class="level" data-level="1" role="radio"><span>🐣</span><b>Kolay</b><small>0–5</small></button>
      <button class="level" data-level="2" role="radio"><span>🐥</span><b>Orta</b><small>0–10</small></button>
      <button class="level" data-level="3" role="radio"><span>🦉</span><b>Zor</b><small>0–20</small></button>
    </div>
    <div class="modes" id="modes"></div>
  </section>

  <section id="play" class="screen">
    <header class="top">
      <button class="icon-btn" id="homeBtn" aria-label="Ana sayfa">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="tools">
        <button class="icon-btn" id="hintBtn" aria-label="İpucu">💡</button>
        <button class="icon-btn" id="speakBtn" aria-label="Soruyu oku">🔈</button>
      </div>
    </header>
    <div class="stage">
      <div class="question" id="question"></div>
      <div class="prompt" id="prompt"></div>
      <div class="visual" id="visual"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <section id="garden" class="screen">
    <header class="top">
      <button class="icon-btn" id="gardenHomeBtn" aria-label="Ana sayfa">🏠</button>
      <h1>Bahçem</h1>
      <div class="pill" aria-label="Toplam yıldız"><span class="star">★</span> <span id="gardenStars">0</span></div>
    </header>
    <div class="garden-scene" id="gardenScene">
      <div class="garden-sun">☀️</div>
      <div class="g-cloud c1"></div><div class="g-cloud c2"></div><div class="g-cloud c3"></div>
      <div class="g-hill back"></div><div class="g-fence"></div><div class="g-hill front"></div>
      <div class="g-pond"></div>
      <div class="garden-grid" id="gardenGrid"></div>
      <div class="g-rain" id="gardenRain"></div>
      <div class="garden-next" id="gardenNext"></div>
      <div class="g-water"><span class="g-streak" id="gardenStreak"></span><button class="g-water-btn" id="waterBtn" aria-label="Bahçeyi sula">💧<b>Sula</b></button></div>
      <div class="g-banner" id="gardenBanner" hidden></div>
    </div>
  </section>

  <section id="shop" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Dükkân</h1>
      <div class="pill" aria-label="Altın">🪙 <span id="shopCoins">0</span></div>
    </header>
    <div class="shop-grid" id="shopGrid"></div>
  </section>

  <section id="tasks" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Görevlerim</h1>
      <div class="pill" aria-label="Bilet">🎟️ <span id="tasksTickets">0</span></div>
    </header>
    <div class="task-list" id="taskList"></div>
  </section>

  <section id="parent" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Ebeveyn</h1>
      <span></span>
    </header>
    <div class="parent-body" id="parentBody"></div>
  </section>

  <section id="end" class="screen">
    <div class="end-card">
      <div class="end-stars" id="endStars"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="end-loot" id="endLoot"></div>
      <div class="end-new" id="endNew" hidden></div>
      <div class="end-actions">
        <button class="big-btn" id="againBtn">🔁 Tekrar</button>
        <button class="big-btn alt" id="endHomeBtn">🏠 Ana sayfa</button>
      </div>
    </div>
  </section>
</main>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="ver" class="ver" aria-hidden="true"></div>
<div id="cheer" class="cheer"></div>
<div id="confetti"></div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // Yeni sürüm devreye girince bir kez yenile ki bütün dosyalar aynı sürümden gelsin.
    // Tur sürüyorsa yarıda kesme; ana sayfaya ya da sonuç ekranına dönünce yenile.
    const hadController = !!navigator.serviceWorker.controller;
    let pending = false;
    const reloadWhenIdle = () => {
      if (!window.__mg || window.__mg.screen !== 'play') location.reload();
      else setTimeout(reloadWhenIdle, 2000);
    };
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !pending) { pending = true; reloadWhenIdle(); }
    });
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>

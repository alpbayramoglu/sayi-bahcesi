<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sayı Bahçesi">
<meta name="theme-color" content="#9ADCF8">
<title>Sayı Bahçesi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/baloo2-800.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="home" class="screen active">
    <header class="top">
      <h1 class="home-title">Sayı Bahçesi</h1>
      <div class="tools">
        <button class="icon-btn tasks-icon" id="tasksBtn" aria-label="Görevlerim">📋<span class="badge" id="taskBadge" hidden>0</span></button>
        <button class="icon-btn soft" id="settingsBtn" aria-label="Ayarlar">⚙️</button>
      </div>
    </header>
    <div class="home-body">
      <button class="hero" id="playBtn">
        <span class="hero-k">Sıradaki tur · 10 soru</span>
        <span class="hero-row">
          <span class="hero-main"><b>Oyna</b><span id="playWhat"></span></span>
          <span class="hero-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5.8v12.4c0 .8.9 1.3 1.6.9l9.4-6.2c.6-.4.6-1.4 0-1.8L10.1 4.9c-.7-.4-1.6.1-1.6.9z"/></svg></span>
        </span>
        <span class="hero-loot"><span>Bitirince:</span><span class="chip" id="lootTicket"></span><span class="chip" id="lootCoins"></span></span>
      </button>
      <div class="home-side">
        <div class="rewards">
          <button class="reward" id="warBtn" style="--c:#E5483B;--bg:#FDE7E5"><span class="r-ico">⛄</span><span class="r-lbl">Kartopu Savaşı</span><span class="r-sub" id="warSub"></span></button>
          <button class="reward" id="gardenBtn" style="--c:#34C17B;--bg:#E1F6EA"><span class="tag" id="gardenDot" hidden>yeni</span><span class="r-ico">🌻</span><span class="r-lbl">Bahçem</span><span class="r-sub" id="gardenSub"></span></button>
          <button class="reward" id="shopBtn" style="--c:#F5A524;--bg:#FEF1DA"><span class="r-ico">🛒</span><span class="r-lbl">Dükkân</span><span class="r-sub" id="shopSub"></span></button>
        </div>
        <div class="cats">
          <button class="cat" data-g="num" style="--c:#3FA9F5;--bg:#E3F2FD"><span class="c-ico">2+3</span><span class="c-txt"><b>Sayılar</b><small>Toplama, çıkarma, dizi, boşluk</small><span class="c-prog"><span class="c-bar"><i></i></span><em></em></span></span><span class="chev" aria-hidden="true">›</span></button>
          <button class="cat" data-g="shape" style="--c:#9B6BEF;--bg:#F0E8FD"><span class="c-ico">🔺🔵</span><span class="c-txt"><b>Şekiller</b><small>Örüntü, ayna, farklı olan, sudoku</small><span class="c-prog"><span class="c-bar"><i></i></span><em></em></span></span><span class="chev" aria-hidden="true">›</span></button>
        </div>
      </div>
    </div>
  </section>

  <section id="cat" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">‹</button>
      <h1 id="catTitle">Sayılar</h1>
      <span class="top-spacer"></span>
    </header>
    <div class="cat-body">
      <div class="lv-box">
        <span class="lv-k">Zorluk</span>
        <div class="levels" role="radiogroup" aria-label="Zorluk">
          <button class="level" data-level="1" role="radio"><b>Kolay</b><small>0–5</small><span class="lv-dots"><i></i></span></button>
          <button class="level" data-level="2" role="radio"><b>Orta</b><small>0–10</small><span class="lv-dots"><i></i><i></i></span></button>
          <button class="level" data-level="3" role="radio"><b>Zor</b><small>0–20</small><span class="lv-dots"><i></i><i></i><i></i></span></button>
        </div>
      </div>
      <div class="mode-grid" id="catGrid"></div>
      <p class="cat-note">Her tur 10 soru. Bitirince 1 bilet ve yıldız başına 2 altın.</p>
    </div>
  </section>

  <section id="play" class="screen">
    <header class="top">
      <button class="icon-btn" id="homeBtn" aria-label="Ana sayfa">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="tools">
        <button class="icon-btn" id="hintBtn" aria-label="İpucu">💡</button>
        <button class="icon-btn" id="speakBtn" aria-label="Soruyu oku">🔈</button>
      </div>
    </header>
    <div class="stage">
      <div class="question" id="question"></div>
      <div class="prompt" id="prompt"></div>
      <div class="visual" id="visual"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <section id="garden" class="screen">
    <header class="top">
      <button class="icon-btn" id="gardenHomeBtn" aria-label="Ana sayfa">🏠</button>
      <h1 id="gardenTitle">Bahçem</h1>
      <div class="g-tabs" id="gardenTabs"></div>
      <div class="pill" aria-label="Toplam yıldız"><span class="star">★</span> <span id="gardenStars">0</span></div>
    </header>
    <div class="garden-scene" id="gardenScene">
      <div class="garden-sun">☀️</div>
      <div class="g-cloud c1"></div><div class="g-cloud c2"></div><div class="g-cloud c3"></div>
      <div class="g-hill back"></div><div class="g-fence"></div><div class="g-hill front"></div>
      <div class="g-pond"></div>
      <div class="g-aqua" aria-hidden="true"><i class="ray r1"></i><i class="ray r2"></i><i class="ray r3"></i><i class="sand"></i><span class="weed w1">🌿</span><span class="weed w2">🌿</span><span class="weed w3">🌿</span><b class="bub b1"></b><b class="bub b2"></b><b class="bub b3"></b><b class="bub b4"></b><b class="bub b5"></b></div>
      <div class="g-forest" aria-hidden="true"><span>🌲</span><span>🌳</span><span>🌲</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌲</span></div>
      <div class="garden-grid" id="gardenGrid"></div>
      <div class="g-rain" id="gardenRain"></div>
      <div class="garden-next" id="gardenNext"></div>
      <div class="g-water"><span class="g-streak" id="gardenStreak"></span><button class="g-water-btn" id="waterBtn" aria-label="Bahçeyi sula">💧<b>Sula</b></button></div>
      <div class="g-banner" id="gardenBanner" hidden></div>
    </div>
  </section>

  <section id="shop" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Dükkân</h1>
      <div class="pill" aria-label="Altın">🪙 <span id="shopCoins">0</span></div>
    </header>
    <div class="shop-grid" id="shopGrid"></div>
  </section>

  <section id="tasks" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Görevlerim</h1>
      <div class="pill" aria-label="Bilet">🎟️ <span id="tasksTickets">0</span></div>
    </header>
    <div class="task-list" id="taskList"></div>
  </section>

  <section id="parent" class="screen">
    <header class="top">
      <button class="icon-btn back" aria-label="Ana sayfa">🏠</button>
      <h1>Ebeveyn</h1>
      <span></span>
    </header>
    <div class="parent-body" id="parentBody"></div>
  </section>

  <section id="end" class="screen">
    <div class="end-card">
      <div class="end-stars" id="endStars"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="end-loot" id="endLoot"></div>
      <div class="end-new" id="endNew" hidden></div>
      <div class="end-actions">
        <button class="big-btn" id="againBtn">🔁 Tekrar</button>
        <button class="big-btn alt" id="endHomeBtn">🏠 Ana sayfa</button>
      </div>
    </div>
  </section>
</main>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="ver" class="ver" aria-hidden="true"></div>
<div id="cheer" class="cheer"></div>
<div id="confetti"></div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // Yeni sürüm devreye girince bir kez yenile ki bütün dosyalar aynı sürümden gelsin.
    // Tur sürüyorsa yarıda kesme; ana sayfaya ya da sonuç ekranına dönünce yenile.
    const hadController = !!navigator.serviceWorker.controller;
    let pending = false;
    const reloadWhenIdle = () => {
      if (!window.__mg || window.__mg.screen !== 'play') location.reload();
      else setTimeout(reloadWhenIdle, 2000);
    };
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !pending) { pending = true; reloadWhenIdle(); }
    });
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sayı Bahçesi">
<meta name="theme-color" content="#4FB8F5">
<meta name="format-detection" content="telephone=no">
<title>War of Blocks</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="preload" href="../fonts/baloo2-800.woff" as="font" type="font/woff" crossorigin>
<style>
  /* Baloo 2 ExtraBold (SIL OFL 1.1, fonts/OFL-baloo2.txt) — Türkçe harfler dahil, çevrimdışı çalışsın diye repo içinde */
  @font-face {
    font-family: 'Baloo 2'; font-style: normal; font-weight: 800; font-display: swap;
    src: url(../fonts/baloo2-800.woff) format('woff');
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #8FD6FA;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; border-radius: 14px; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 5;
    background: linear-gradient(#4FB8F5, #D2F0FF); color: #1E2233;
    flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    font: 800 28px "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif; text-align: center;
  }
  #rotate .phone {
    width: 56px; height: 96px; box-sizing: border-box;
    border: 7px solid #1E2233; border-radius: 14px; background: #FFFFFF;
    box-shadow: 0 5px 0 #1E2233;
    animation: turn 2.2s ease-in-out infinite;
  }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" aria-label="War of Blocks oyunu"></canvas></div>
  <div id="rotate"><div class="phone"></div><div>Telefonu yan çevir</div></div>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      // Yeni sürüm devreye girince bir kez yenile ki bütün dosyalar aynı sürümden gelsin.
      // Maç sürüyorsa yarıda kesme; maç bitip menüye dönünce yenile.
      const hadController = !!navigator.serviceWorker.controller;
      let pending = false;
      const reloadWhenIdle = () => {
        if (!window.__wob || window.__wob.screen !== 'play') location.reload();
        else setTimeout(reloadWhenIdle, 2000);
      };
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !pending) { pending = true; reloadWhenIdle(); }
      });
      addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Şövalye Macerası · deneme</title>
<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 800; font-display: swap; src: url(../fonts/baloo2-800.woff) format('woff'); }   /* Sayı Bahçesi içinde yüklenir */
  * { box-sizing: border-box; touch-action: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141A30; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font: 800 16px/1.2 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif; color: #fff; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 16px; }
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.12);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); pointer-events: none; display: none; z-index: 3; }
  #joy.on { display: block; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #bombHint { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 80px; height: 80px;
    border-radius: 50%; background: rgba(229,72,59,.55); display: none; place-items: center; font-size: 32px; pointer-events: none; z-index: 3;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.2); transition: transform .08s; }
  body.playing #bombHint { display: grid; }
  #bombHint.hit { transform: scale(.88); background: rgba(229,72,59,.85); }
  #ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(18,23,49,.55); z-index: 5; }
  #ov[hidden] { display: none; }
  .card { background: #fff; color: #1E2233; border-radius: 26px; padding: 22px 30px; text-align: center; min-width: 280px; box-shadow: 0 10px 0 rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 6px; font-size: 32px; } .card p { margin: 4px 0 14px; color: #4B5A72; }
  .card button { border: 0; border-radius: 18px; padding: 12px 22px; margin: 4px; font: inherit; font-size: 20px; color: #fff; background: #34C17B; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); }
  .card button.alt { background: #3FA9F5; }
  #rotate { position: fixed; inset: 0; z-index: 9; display: none; background: #1E2233; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font-size: 24px; }
  #rotate i { width: 52px; height: 90px; border: 7px solid #fff; border-radius: 14px; animation: turn 2.2s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (pointer: fine) { #joy, #bombHint { display: none !important; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="joy"><i id="knob"></i></div>
<div id="bombHint">💣</div>
<div id="ov" hidden></div>
<div id="rotate"><i></i>Telefonu yan çevir</div>
<script>
/* Şövalye Macerası: bomba bırakıp labirentte ilerlenen bir oyun (yalnız yerel deneme). Haritalar, karakterler ve adlar bize ait.
   8 dünya × 8 bölüm. 1–7. bölümler: bütün düşmanları yok et, blokların altındaki kapıya gir. 8. bölüm: dünyanın boss'u.
   Izgara 15×11: kenarlar ve çift koordinatlı sütunlar sert taş, aralar rastgele kırılan blok. Alev kendine de değer.
   Görünüm: bloklar üstten-önden (3/4) çizilir; zemin ve sert taşlar bölüm başında ayrı bir tuvale bir kez çizilir. */
const VERSION = 'v0.5';   // her değişiklikte artır: v0.2, v0.3 …
// Sayı Bahçesi'nin içinde (sayi-bahcesi/sovalye/) her bölüm 1 bilet, bitirince altın; ayrı repoda biletsiz bağımsız oyun
const IN_APP = /\/sayi-bahcesi\/sovalye\//.test(location.pathname) || /[?&]app\b/.test(location.search);
const Wallet = {
  key: 'sayi-bahcesi.v1',
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  write(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) {} },
  get tickets() { return this.read().tickets || 0; },
  useTicket() { const d = this.read(); if (!(d.tickets > 0)) return false; d.tickets--; this.write(d); return true; },
  addCoins(n) { const d = this.read(); d.coins = (d.coins || 0) + n; this.write(d); },
};
const home = () => location.assign(new URL('../', location.href).href);
const COLS = 15, ROWS = 11, T = 48;
// Kenar taşları mantıkta duruyor ama çizilmiyor: yerine ince çerçeve (F). Bilgiler soldaki panelde (SIDE).
const F = 10, SIDE = 100, MW = (COLS - 2) * T + 2 * F, MH = (ROWS - 2) * T + 2 * F, W = SIDE + MW, H = MH;
const INK = '#1E2233', FONT = "'Baloo 2', 'Arial Rounded MT Bold', system-ui";
const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const hash = (x, y, s = 0) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const BACK = { up: 'down', down: 'up', left: 'right', right: 'left' };

/* ---------- dünyalar ve bölümler ---------- */
// floor: zemin; deco: zemin dokusu; hard: sert taş [üst, ön, ayrıntı]; soft: kırılan blok türü ve [üst, ön]; amb: havadaki canlılar
const THEMES = {
  grass: { floor: ['#86D065', '#7DC85D'], det: '#5FAE48', deco: 'grass', hard: ['#AEB8CB', '#7D889F', '#93A0B6'], soft: 'brick', sc: ['#EFA862', '#C77B36'], frame: '#5E9E45', map: '#6CC453', amb: 'butterfly', sky: ['#6EC6FF', '#C9EEFF'] },
  sand: { floor: ['#F6DDA8', '#EFD398'], det: '#D9B477', deco: 'sand', hard: ['#E2BE8E', '#B48D60', '#CBA577'], soft: 'brick', sc: ['#FFD27A', '#D6A044'], frame: '#C9A06A', map: '#F2CF83', amb: 'sparkle', sky: ['#5BC0F0', '#D6F2FF'] },
  snow: { floor: ['#EEF6FC', '#E3EEF7'], det: '#C5DDF0', deco: 'snow', hard: ['#B9E2FA', '#6FAED8', '#93CBEE'], soft: 'snow', sc: ['#FFFFFF', '#BCD9EE'], frame: '#7FB8DE', map: '#DCEFFB', amb: 'flake', sky: ['#8FB6E0', '#E4F1FB'] },
  forest: { floor: ['#4F9C53', '#48924C'], det: '#3B7E40', deco: 'forest', hard: ['#A87348', '#6E4527', '#8B5A33'], soft: 'mush', sc: ['#E5483B', '#FFF2E0'], frame: '#3E6B33', map: '#3E9A48', amb: 'leaf', sky: ['#7CC59A', '#D9F1D9'] },
  lava: { floor: ['#5B4646', '#533F3F'], det: '#3F2F2F', deco: 'lava', hard: ['#5E4E57', '#2E242A', '#463A41'], soft: 'brick', sc: ['#9A6244', '#5E3826'], frame: '#2E242A', map: '#E5483B', amb: 'ember', sky: ['#4A2E3A', '#C2563A'] },
  cloud: { floor: ['#E3DDFF', '#DAD3FC'], det: '#C9C0F2', deco: 'cloud', hard: ['#FFE9A3', '#D9B24E', '#F2D27A'], soft: 'cloud', sc: ['#FFFFFF', '#CFC6F4'], frame: '#C9A64C', map: '#C6BCFA', amb: 'sparkle', sky: ['#A99BF5', '#F2EEFF'] },
  clock: { floor: ['#CF9C64', '#C4915A'], det: '#A9773F', deco: 'plank', hard: ['#C9D2E3', '#7D889F', '#A9B4C8'], soft: 'crate', sc: ['#E2AE64', '#9F6E31'], frame: '#6B4528', map: '#DDAA66', amb: 'dust', sky: ['#E9A86A', '#FBE3C2'] },
  dark: { floor: ['#4D416A', '#463B61'], det: '#382F52', deco: 'cobble', hard: ['#5A4E7E', '#2B2442', '#463D68'], soft: 'brick', sc: ['#8070A8', '#4E4277'], frame: '#241E38', map: '#7461B3', amb: 'wisp', sky: ['#2B2147', '#6E5AA8'] },
};
// pool: dünyada görülen düşmanlar; add: o bölümden itibaren gelen yeni düşman; boss: 8. bölüm
// 4–8. dünyaların kendi düşman ve boss'ları sonraki adımda; şimdilik öncekilerin hızlı hâlleri
const WORLDS = [
  { name: 'Çimen Bahçe', th: 'grass', pool: ['blob'], add: { 3: 'drop' }, boss: 'kingblob' },
  { name: 'Kumsal', th: 'sand', pool: ['blob', 'drop'], add: { 0: 'crab' }, boss: 'bigcrab' },
  { name: 'Karlı Dağ', th: 'snow', pool: ['drop', 'crab'], add: { 0: 'ghost' }, boss: 'snowman' },
  { name: 'Mantar Ormanı', th: 'forest', pool: ['blob', 'crab', 'ghost'], add: {}, boss: 'kingblob' },
  { name: 'Lav Mağarası', th: 'lava', pool: ['drop', 'crab', 'ghost'], add: {}, boss: 'bigcrab' },
  { name: 'Bulut Şatosu', th: 'cloud', pool: ['blob', 'drop', 'ghost'], add: {}, boss: 'snowman' },
  { name: 'Saat Kulesi', th: 'clock', pool: ['drop', 'crab', 'ghost'], add: {}, boss: 'bigcrab' },
  { name: 'Karanlık Kale', th: 'dark', pool: ['blob', 'drop', 'crab', 'ghost'], add: {}, boss: 'kingblob' },
];
// Güçlendirmeler seyrek: 64 bölümde 9 tane ("dünya-bölüm", 0'dan sayılır). Alınan bir daha çıkmaz (prog.got).
const ITEMS_AT = { '0-1': 'bomb', '0-4': 'fire', '1-2': 'fire', '1-5': 'bomb', '2-3': 'speed', '3-1': 'fire', '3-5': 'bomb', '4-3': 'fire', '5-2': 'speed' };
const CAP = { bombs: 4, fire: 5, speed: 2 };
// Hız: yavaş başlar, bölüm ve dünya ilerledikçe artar (1-1'de 0,78; 8-7'de 1,4 civarı)
const speedOf = (w, l) => .76 + l * .015 + w * .035;   // 1-1'de 0,76; 8-7'de 1,1 civarı: zorluk hızdan çok düşman sayısı ve türünden
function levelCfg(w, l) {
  const Wd = WORLDS[w], name = `${w + 1}-${l + 1}`;
  if (l === 7) return { w, l, name, boss: Wd.boss, soft: .14, enemies: [], item: null, spd: speedOf(w, 3) };
  const pool = [...Wd.pool]; for (const [k, v] of Object.entries(Wd.add)) if (l >= +k) pool.push(v);
  const n = Math.min(8, 2 + Math.floor(l * .6) + Math.floor(w * .5)), enemies = [];
  for (const [k, v] of Object.entries(Wd.add)) if (l >= +k) enemies.push(v);   // yeni düşman mutlaka görünsün
  while (enemies.length < n) enemies.push(pick(pool));
  return { w, l, name, soft: clamp(.36 + l * .025 + w * .02, .3, .62), enemies, item: prog.got[w * 8 + l] ? null : ITEMS_AT[w + '-' + l] || null, spd: speedOf(w, l) };
}

/* ---------- kayıt ---------- */
const SAVE_KEY = 'sovalye.v1';
let prog = (() => { try { return Object.assign({ done: {}, got: {}, bombs: 1, fire: 1, speed: 0 }, JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) { return { done: {}, bombs: 1, fire: 1, speed: 0 }; } })();
// eski kayıtlarda tavanı aşanlar yeni tavana iner
prog.got = prog.got || {}; for (const k of Object.keys(CAP)) prog[k] = Math.min(CAP[k], prog[k] || 0); prog.bombs = Math.max(1, prog.bombs); prog.fire = Math.max(1, prog.fire);
const saveProg = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(prog)); } catch (e) {} };
const unlocked = i => i === 0 || !!prog.done[i - 1];
const worldOpen = w => unlocked(w * 8);
const doneIn = w => Array.from({ length: 8 }, (_, l) => prog.done[w * 8 + l] ? 1 : 0).reduce((a, b) => a + b, 0);
const nextIn = w => { for (let l = 0; l < 8; l++) if (!prog.done[w * 8 + l]) return l; return 7; };
const curWorldOf = () => { let w = 0; for (let i = 0; i < 8; i++) if (worldOpen(i)) w = i; return w; };

let scene = 'worlds', curWorld = 0, lives = 3, G = null, mapT = 0, mapAmb = null, mapAmbKey = '';

/* ---------- bölüm kurulumu ---------- */
function makeLevel(w, l) {
  const R = levelCfg(w, l), th = THEMES[WORLDS[w].th], map = [];
  for (let y = 0; y < ROWS; y++) { map.push([]); for (let x = 0; x < COLS; x++) {
    const hard = x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1 || (x % 2 === 0 && y % 2 === 0);
    map[y].push(hard ? 1 : 0);
  } }
  const safe = (x, y) => x + y <= 4;   // başlangıç köşesi boş: ilk bombadan kaçacak yer olsun
  const free = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) if (!map[y][x] && !safe(x, y)) {
    const nearBoss = R.boss && Math.abs(x - 9) <= 2 && Math.abs(y - 5) <= 2;
    if (!nearBoss && Math.random() < R.soft) map[y][x] = 2; else free.push([x, y]);
  }
  const softs = []; for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (map[y][x] === 2) softs.push([x, y]);
  softs.sort(() => Math.random() - .5);
  const hidden = {};   // "x,y" → 'door' | güçlendirme
  if (!R.boss) {
    const far = softs.filter(([x, y]) => x + y > 10);
    hidden[(far.length ? far : softs)[0]] = 'door';
    if (R.item) { const s = softs.find(k => !hidden[k]); if (s) hidden[s] = R.item; }
  }
  const enemies = [], spots = free.filter(([x, y]) => x + y > 7).sort(() => Math.random() - .5);
  for (const kind of R.enemies) if (spots.length) { const [x, y] = spots.pop(); enemies.push(mkEnemy(kind, x, y, R.spd)); }
  floorCache = null;
  return {
    w, l, R, name: R.name, th, map, hidden, items: {}, door: null, bombs: [], flames: [], parts: [], shots: [], rings: [], enemies,
    amb: [],
    boss: R.boss ? mkBoss(R.boss, 9, 5, w) : null,
    p: { x: 1, y: 1, dir: 'down', last: null, walk: 0, dead: 0, inv: 1.2 }, t: 0, state: 'play', clearT: 0, shake: 0,
  };
}
const ESPD = { blob: 1.7, drop: 2.5, crab: 2.6, ghost: 1.35 };
function mkEnemy(kind, x, y, mul = 1) {
  return { kind, x, y, tx: x, ty: y, fx: x, fy: y, dir: pick(Object.keys(DIRS)), spd: ESPD[kind] * mul, dead: 0, ph: Math.random() * 6 };
}
const BOSS = { kingblob: { hp: 3, spd: 1.2 }, bigcrab: { hp: 4, spd: 1.6 }, snowman: { hp: 4, spd: .85 } };
function mkBoss(kind, x, y, w) {
  const b = BOSS[kind], spd = b.spd * (1 + w * .05);
  return { kind, boss: true, x, y, tx: x, ty: y, fx: x, fy: y, dir: 'left', spd, base: spd, hp: b.hp, max: b.hp, inv: 1, dead: 0, ph: 0, cd: 2, charge: null };
}
const cell = (x, y) => (G.map[y] || [])[x];
const bombAt = (x, y) => G.bombs.find(b => b.x === x && b.y === y);
const solid = (x, y) => cell(x, y) !== 0 || !!bombAt(x, y);
// Düşmanlar alevin hâlâ yandığı kareye adım atmaz (kırılan bloğun yerine hemen yürüyüp ölmesin); kar ruhu blokların içinden geçer
const blocks = (e, x, y) => { const c = cell(x, y); return c === 1 || (c === 2 && e.kind !== 'ghost') || !!bombAt(x, y) || G.flames.some(f => f.cells.some(q => q.x === x && q.y === y)); };

/* ---------- oyuncu hareketi ----------
   Köşe yardımı: dönmek istenen yöne yakındaki (≤0,62 kare) açık satır/sütun aranır, oraya kendiliğinden kayılır.
   Önceden yön alma: istenen yön henüz kapalıysa eski yönde devam edilir, dönülebilen ilk yerde dönülür. */
function movePlayer(dt, d) {
  const p = G.p; if (!d) return;
  const dist = (2.8 + prog.speed * .45) * dt;
  if (tryMove(p, d, dist, dt)) { p.dir = d; p.last = d; return; }
  if (p.last && p.last !== d && p.last !== BACK[d] && tryMove(p, p.last, dist, dt)) { p.dir = p.last; return; }
  p.dir = d;
}
function tryMove(p, d, dist, dt) {
  const [dx, dy] = DIRS[d], cx = Math.round(p.x), cy = Math.round(p.y), ox = p.x, oy = p.y;
  const pass = (x, y) => cell(x, y) === 0 && (!bombAt(x, y) || (x === cx && y === cy));
  // a: hareket ekseni (x ya da y), b: dik eksen
  const hor = !!dx, s = dx || dy, A = hor ? 'x' : 'y', B = hor ? 'y' : 'x', ca = hor ? cx : cy, cb = hor ? cy : cx;
  const at = (a, b) => hor ? pass(a, b) : pass(b, a);
  let lane = null;
  for (const b of [cb, p[B] >= cb ? cb + 1 : cb - 1]) {
    if (Math.abs(p[B] - b) > .62) continue;
    if (b !== cb && !at(ca, b)) continue;
    if (at(ca + s, b) || (s > 0 ? p[A] < ca - .001 : p[A] > ca + .001)) { lane = b; break; }
  }
  if (lane === null) return false;
  const off = p[B] - lane;
  if (Math.abs(off) > .001) { const m = Math.min(Math.abs(off), dist); p[B] -= Math.sign(off) * m; dist -= m; }
  if (dist > 0 && Math.abs(p[B] - lane) <= .001) {
    p[B] = lane;
    const n = p[A] + s * dist;
    p[A] = at(ca + s, lane) ? n : (s > 0 ? Math.min(n, ca) : Math.max(n, ca));
  }
  const moved = Math.abs(p.x - ox) + Math.abs(p.y - oy) > 1e-4;
  if (moved) p.walk += dt;
  return moved;
}

/* ---------- düşmanlar: kareden kareye ---------- */
// top: rastgele dolaşır · damla: sık sık oyuncuya yönelir · yengeç: hızlı, duvara çarpana kadar düz gider · kar ruhu: blokların içinden geçer
function stepEnemy(e, dt) {
  if (e.dead) { e.dead += dt; return; }
  e.ph += dt;
  // Gittiği kareye bomba konduysa yarı yoldan geri döner: bombalı kareye (ve üstündeki oyuncuya) giremez
  if ((e.tx !== e.fx || e.ty !== e.fy) && bombAt(e.tx, e.ty)) {
    [e.tx, e.ty, e.fx, e.fy] = [e.fx, e.fy, e.tx, e.ty]; e.dir = BACK[e.dir];
    if (e.charge) { e.charge = null; e.spd = e.base; e.cd = 2.5; }
  }
  const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy), s = e.spd * dt;
  if (d > s) { e.x += dx / d * s; e.y += dy / d * s; return; }
  e.x = e.tx; e.y = e.ty;
  const opts = Object.keys(DIRS).filter(k => { const [ax, ay] = DIRS[k]; return !blocks(e, e.x + ax, e.y + ay); });
  if (!opts.length) return;
  let dir = e.dir;
  if (e.kind === 'bigcrab') {
    if (e.charge && opts.includes(e.charge)) dir = e.charge;
    else {
      if (e.charge) { e.charge = null; e.spd = e.base; e.cd = 2.5; G.shake = .2; sfx('thud'); }
      const ln = lineTo(e);
      if (e.cd <= 0 && ln) { e.charge = dir = ln; e.spd = 4.6; sfx('charge'); }
      else if (!opts.includes(dir) || Math.random() < .2) { const f = opts.filter(k => k !== BACK[e.dir]); dir = pick(f.length ? f : opts); }
    }
  } else if ((e.kind === 'drop' && Math.random() < .5) || (e.kind === 'kingblob' && Math.random() < .5)) {
    dir = opts.sort((a, b) => dist2(e, DIRS[a]) - dist2(e, DIRS[b]))[0];
  } else if (e.kind === 'crab') {
    if (!opts.includes(dir)) { const h = opts.filter(k => k === 'left' || k === 'right'); dir = pick(h.length ? h : opts); }
  } else if (!opts.includes(dir) || Math.random() < .25) {
    const fwd = opts.filter(k => k !== BACK[dir]); dir = pick(fwd.length ? fwd : opts);
  }
  e.dir = dir; e.fx = e.x; e.fy = e.y; e.tx = e.x + DIRS[dir][0]; e.ty = e.y + DIRS[dir][1];
}
const dist2 = (e, [ax, ay]) => (e.x + ax - G.p.x) ** 2 + (e.y + ay - G.p.y) ** 2;
function lineTo(e) {   // aynı satır/sütundaysa ve arada engel yoksa oyuncunun yönü
  const px = Math.round(G.p.x), py = Math.round(G.p.y);
  if (px !== e.x && py !== e.y) return null;
  const dir = px === e.x ? (py > e.y ? 'down' : 'up') : (px > e.x ? 'right' : 'left'), [ax, ay] = DIRS[dir];
  for (let x = e.x + ax, y = e.y + ay; x !== px || y !== py; x += ax, y += ay) if (solid(x, y)) return null;
  return dir;
}

/* ---------- boss ---------- */
function stepBoss(b, dt) {
  if (b.dead) { b.dead += dt; if (b.dead > .9 && !G.door) openDoorNear(Math.round(b.x), Math.round(b.y)); return; }
  b.inv = Math.max(0, b.inv - dt); b.cd -= dt;
  if (b.kind === 'snowman' && b.cd <= 0) {   // dört yöne kartopu
    b.cd = 2.8; sfx('throw');

  }
  stepEnemy(b, dt);
  // alev boss'un karesine ya da yanına değerse vurulur
  if (b.inv <= 0 && G.flames.some(f => f.t > .08 && f.cells.some(c => Math.abs(c.x - b.x) < .95 && Math.abs(c.y - b.y) < .95))) {
    b.hp--; b.inv = 1.4; G.shake = .35; sfx('hit');

    else if (b.kind === 'kingblob' && G.enemies.filter(e => !e.dead).length < 5) for (let i = 0; i < 2; i++) G.enemies.push(mkEnemy('blob', Math.round(b.x), Math.round(b.y), G.R.spd));

}

}

    const tx = Math.round(s.x), ty = Math.round(s.y);
    if (cell(tx, ty) !== 0 || bombAt(tx, ty) || inFlame(tx, ty)) { s.dead = true; burst(s.x, s.y, 6, ['#fff', '#CFE8FF'], 4); }
    if (!s.dead && G.p.inv <= 0 && Math.hypot(s.x - G.p.x, s.y - G.p.y) < .45) { s.dead = true; return die(); }
  }

/* ---------- bomba, alev, parçacık ---------- */
function dropBomb() {

  const x = Math.round(G.p.x), y = Math.round(G.p.y);
  if (bombAt(x, y) || G.bombs.length >= prog.bombs) return;
  if (G.boss && !G.boss.dead && Math.round(G.boss.x) === x && Math.round(G.boss.y) === y) return;
  G.bombs.push({ x, y, t: 2.4, r: prog.fire }); sfx('drop');
}
function explode(b) {
  G.bombs.splice(G.bombs.indexOf(b), 1);

  for (const [d, [dx, dy]] of Object.entries(DIRS)) {
    for (let i = 1; i <= b.r; i++) {
      const x = b.x + dx * i, y = b.y + dy * i, c = cell(x, y);
      if (c === 1) break;
      if (c === 2) { breakBlock(x, y); cells.push({ x, y, k: 'end', d }); break; }
      const other = bombAt(x, y); if (other) other.t = Math.min(other.t, .08);   // zincirleme
      cells.push({ x, y, k: i === b.r ? 'end' : 'mid', d });
      if (G.items[x + ',' + y]) delete G.items[x + ',' + y];   // açıktaki güçlendirme yanar
    }
  }
  G.flames.push({ cells, t: .55 }); G.shake = Math.max(G.shake, .25); sfx('boom');
  G.rings.push({ x: b.x, y: b.y, t: 0 });
  for (const cl of cells) if (Math.random() < .6) G.parts.push({ x: cl.x + .5, y: cl.y + .4, vx: (Math.random() - .5) * .8, vy: -.6 - Math.random() * .6, t: 1, smoke: true, r: 8 + Math.random() * 6 });
}
function burst(x, y, n, cols, sp) { for (let i = 0; i < n; i++) G.parts.push({ x: x + .5, y: y + .5, vx: (Math.random() - .5) * sp, vy: -Math.random() * sp * .8, t: .8, c: pick(cols) }); }
function breakBlock(x, y) {
  G.map[y][x] = 0;

}
function blastCells(b) {
  const out = [[b.x, b.y]];
  for (const [dx, dy] of Object.values(DIRS)) for (let i = 1; i <= b.r; i++) {
    const x = b.x + dx * i, y = b.y + dy * i, v = cell(x, y);
    if (v === 1) break; out.push([x, y]); if (v === 2) break;
  }
  return out;
}
const inFlame = (x, y) => G.flames.some(f => f.t > .08 && f.cells.some(c => c.x === x && c.y === y));

/* ---------- havadaki canlılar (kelebek, kar tanesi, kor…) ---------- */
function makeAmb(kind, n, x0, y0, w, h) {
  return Array.from({ length: n }, (_, i) => ({ kind, x: x0 + Math.random() * w, y: y0 + Math.random() * h, x0, y0, w, h, ph: Math.random() * 7, s: .7 + Math.random() * .6 }));
}
function stepAmb(list, dt) {
  for (const a of list) {
    a.ph += dt;
    if (a.kind === 'flake') { a.y += 22 * a.s * dt; a.x += Math.sin(a.ph * 1.5) * 12 * dt; }
    else if (a.kind === 'leaf') { a.y += 18 * a.s * dt; a.x += Math.sin(a.ph * 2) * 26 * dt; }
    else if (a.kind === 'ember' || a.kind === 'wisp') { a.y -= 20 * a.s * dt; a.x += Math.sin(a.ph * 2.4) * 10 * dt; }
    else if (a.kind === 'butterfly') { a.x += Math.cos(a.ph * .7) * 26 * dt; a.y += Math.sin(a.ph * 1.3) * 18 * dt; }
    else { a.x += Math.sin(a.ph * .5) * 6 * dt; a.y += Math.cos(a.ph * .4) * 5 * dt; }
    if (a.y > a.y0 + a.h + 10) a.y = a.y0 - 10; if (a.y < a.y0 - 10) a.y = a.y0 + a.h + 10;
    if (a.x > a.x0 + a.w + 10) a.x = a.x0 - 10; if (a.x < a.x0 - 10) a.x = a.x0 + a.w + 10;
  }
}

  const c = ctx;
  for (const a of list) {
    c.save(); c.translate(a.x, a.y); c.scale(a.s, a.s);
    if (a.kind === 'butterfly') {
      const f = Math.abs(Math.sin(a.ph * 12)); c.fillStyle = ['#FF7AB6', '#FFC21F', '#9B6BEF'][Math.floor(a.ph * 0 + a.s * 10) % 3];

      c.fillStyle = INK; c.fillRect(-1, -5, 2, 8);
    } else if (a.kind === 'flake') { c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(0, 0, 3, 0, 7); c.fill(); }
    else if (a.kind === 'leaf') { c.rotate(Math.sin(a.ph * 3)); c.fillStyle = '#E8A040'; c.beginPath(); c.ellipse(0, 0, 6, 3, 0, 0, 7); c.fill(); c.strokeStyle = '#A8661E'; c.lineWidth = 1; c.beginPath(); c.moveTo(-6, 0); c.lineTo(6, 0); c.stroke(); }
    else if (a.kind === 'ember') { c.fillStyle = `rgba(255,${140 + 60 * Math.sin(a.ph * 8)},40,.9)`; c.beginPath(); c.arc(0, 0, 2.6, 0, 7); c.fill(); c.fillStyle = 'rgba(255,120,40,.25)'; c.beginPath(); c.arc(0, 0, 7, 0, 7); c.fill(); }
    else if (a.kind === 'wisp') { c.fillStyle = 'rgba(190,160,255,.35)'; c.beginPath(); c.arc(0, 0, 6, 0, 7); c.fill(); c.fillStyle = 'rgba(230,215,255,.8)'; c.beginPath(); c.arc(0, 0, 2.5, 0, 7); c.fill(); }
    else { const k = .5 + .5 * Math.sin(a.ph * 3); c.fillStyle = a.kind === 'dust' ? `rgba(255,240,210,${.5 * k})` : `rgba(255,255,255,${.9 * k})`; c.beginPath(); c.moveTo(0, -5); c.lineTo(1.4, -1.4); c.lineTo(5, 0); c.lineTo(1.4, 1.4); c.lineTo(0, 5); c.lineTo(-1.4, 1.4); c.lineTo(-5, 0); c.lineTo(-1.4, -1.4); c.closePath(); c.fill(); }
    c.restore();
  }
}

/* ---------- döngü ---------- */
const held = [];   // basılı yön tuşları (sonuncusu geçerli)

function step(dt) {
  G.t += dt; G.shake = Math.max(0, G.shake - dt);
  for (const p of G.parts) { p.t -= dt * (p.smoke ? .9 : 1); p.x += p.vx * dt; p.y += p.vy * dt; if (!p.smoke) p.vy += 14 * dt; }

  stepAmb(G.amb, dt);
  if (G.state !== 'play') { if (G.state === 'clear' && (G.clearT += dt) > 1.4) levelClear(); if (G.state === 'dead' && (G.p.dead += dt) > 1.6) afterDeath(); return; }
  const p = G.p; if (p.inv > 0) p.inv -= dt;
  movePlayer(dt, held[held.length - 1]);
  for (const b of [...G.bombs]) if ((b.t -= dt) <= 0) explode(b);
  for (const f of G.flames) f.t -= dt; G.flames = G.flames.filter(f => f.t > 0);
  stepShots(dt); if (G.state !== 'play') return;
  if (G.boss) { stepBoss(G.boss, dt); if (!G.boss.dead && p.inv <= 0 && Math.hypot(G.boss.x - p.x, G.boss.y - p.y) < .78) return die(); }
  for (const e of G.enemies) {
    stepEnemy(e, dt);
    if (!e.dead && inFlame(Math.round(e.x), Math.round(e.y))) { e.dead = .01; sfx('pop'); burst(e.x, e.y, 8, ['#fff', '#FFD23F'], 5); }
    if (!e.dead && p.inv <= 0 && Math.hypot(e.x - p.x, e.y - p.y) < .55) return die();
  }
  G.enemies = G.enemies.filter(e => !e.dead || e.dead < .8);
  const px = Math.round(p.x), py = Math.round(p.y);
  if (p.inv <= 0 && inFlame(px, py)) return die();
  const it = G.items[px + ',' + py];
  if (it && Math.hypot(p.x - px, p.y - py) < .4) {
    delete G.items[px + ',' + py]; sfx('item'); burst(px, py, 16, ['#FFD23F', '#fff'], 6);
    prog.got[G.w * 8 + G.l] = true;
    if (it === 'bomb') prog.bombs = Math.min(CAP.bombs, prog.bombs + 1);
    if (it === 'fire') prog.fire = Math.min(CAP.fire, prog.fire + 1);
    if (it === 'speed') prog.speed = Math.min(CAP.speed, prog.speed + 1);
    saveProg();
    G.toast = { text: { bomb: '+1 bomba', fire: 'Alev uzadı', speed: 'Hız arttı' }[it], t: 1.4 };
  }
  if (G.toast && (G.toast.t -= dt) <= 0) G.toast = null;
  if (G.door && !foesLeft() && px === G.door.x && py === G.door.y && Math.hypot(p.x - px, p.y - py) < .3) { G.state = 'clear'; sfx('clear'); }
}
function die() { if (G.state !== 'play') return; G.state = 'dead'; G.p.dead = .01; sfx('die'); }
function afterDeath() {
  lives--;
  if (lives <= 0) {
    G.state = 'over';
    overlay(`<div class="card"><h2>Canın bitti</h2><p>Bölüm ${G.name} yeniden denenebilir.<br>Güçlendirmelerin duruyor.</p><button data-a="retry">Tekrar dene${IN_APP ? ' <small>🎟️ 1</small>' : ''}</button><button class="alt" data-a="map">Harita</button></div>`);
    return;
  }

}

  G.state = 'done';
  const idx = G.w * 8 + G.l; prog.done[idx] = true; saveProg();
  const gain = G.l === 7 ? 5 : 2; if (IN_APP) Wallet.addCoins(gain);
  const loot = IN_APP ? `<p style="font-size:22px;color:#B87A00;margin:0 0 10px">+${gain} 🪙</p>` : '';
  const cost = IN_APP ? ' <small>🎟️ 1</small>' : '';
  if (G.l === 7) {
    const last = G.w === 7;
    overlay(`<div class="card"><h2>${last ? 'Bütün dünyalar kurtarıldı! 🏆' : WORLDS[G.w].name + ' kurtarıldı!'}</h2><p>${last ? 'Gerçek bir şövalyesin!' : 'Sıradaki dünya açıldı: ' + WORLDS[G.w + 1].name}</p>${loot}<button data-a="worlds">Dünya haritası</button></div>`);
  } else overlay(`<div class="card"><h2>Bölüm ${G.name} tamam! ⭐</h2><p>Güçlendirmelerin seninle geliyor.</p>${loot}<button data-a="nextlv">Sonraki bölüm${cost}</button><button class="alt" data-a="map">Harita</button></div>`);
}
function startLevel(w, l) {
  if (IN_APP && !Wallet.useTicket()) {
    overlay(`<div class="card"><h2>🎟️ Biletin bitti</h2><p>Sayı Bahçesi'nde bir matematik turu bitir,<br>bilet kazan. Her bölüm 1 bilet.</p><button data-a="home">Sayı Bahçesi</button><button class="alt" data-a="closeov">Tamam</button></div>`);
    return;
  }
  lives = 3; G = makeLevel(w, l); scene = 'play'; document.body.classList.add('playing'); overlay(''); }

/* ---------- çizim: ortak ---------- */

function outlined(text, x, y, size, col, align = 'center') {

  c.lineWidth = size / 5; c.strokeStyle = INK; c.strokeText(text, x, y); c.fillStyle = col; c.fillText(text, x, y); c.textAlign = 'left';
}

  const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)), 0, 255);
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');

/* ---------- çizim: zemin ve bloklar (3/4 görünüş) ---------- */
let floorCache = null;
function floorTile(x, y, th) {
  const c = ctx, X = x * T, Y = y * T, h = hash(x, y), h2 = hash(x, y, 3);
  c.fillStyle = th.floor[(x + y) % 2]; c.fillRect(X, Y, T, T);
  c.fillStyle = th.det; c.strokeStyle = th.det; c.lineWidth = 2; c.lineCap = 'round';
  if (th.deco === 'grass') {
    for (let k = 0; k < 4; k++) { const bx = X + 6 + hash(x, y, k) * 36, by = Y + 10 + hash(x, y, k + 9) * 30; c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - 2, by - 6); c.moveTo(bx + 3, by); c.lineTo(bx + 4, by - 5); c.stroke(); }

  } else if (th.deco === 'sand') {
    for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(X + hash(x, y, k) * T, Y + hash(x, y, k + 5) * T, 1.3, 0, 7); c.fill(); }

    else if (h < .13) { c.strokeStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(X + 24, Y + 40, 10, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
  } else if (th.deco === 'snow') {

  } else if (th.deco === 'forest') {

    c.fillStyle = 'rgba(60,35,10,.5)'; c.beginPath(); c.arc(X + 4, Y + 8, 1.2, 0, 7); c.arc(X + 44, Y + 24, 1.2, 0, 7); c.fill();
  } else if (th.deco === 'cobble') {

    if (h < .1) { c.fillStyle = 'rgba(160,120,255,.4)'; c.beginPath(); c.arc(X + 12, Y + 12, 2, 0, 7); c.fill(); }
  }
}
function flower(x, y, col) { const c = ctx; c.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k * 1.256; c.beginPath(); c.arc(x + Math.cos(a) * 3.4, y + Math.sin(a) * 3.4, 2.6, 0, 7); c.fill(); } c.fillStyle = '#FFC21F'; c.beginPath(); c.arc(x, y, 2, 0, 7); c.fill(); }
function blockShadow(X, Y) { ctx.fillStyle = 'rgba(20,20,40,.22)'; rr(X + 7, Y + 10, T - 6, T - 6, 10); ctx.fill(); }
function stone(X, Y, th) {   // sert taş: üst yüz açık, ön yüz koyu; temaya göre ayrıntı

  else if (th.deco === 'snow') { c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.moveTo(X + 10, Y + 28); c.lineTo(X + 18, Y + 10); c.lineTo(X + 22, Y + 10); c.lineTo(X + 14, Y + 28); c.fill(); c.fillStyle = '#fff'; rr(X + 4, Y + 3, T - 8, 7, 4); c.fill(); }

let ac;

/* ---------- giriş ---------- */
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };

addEventListener('keydown', e => {
  if (KEYS[e.key]) { press(KEYS[e.key]); e.preventDefault(); }
  if (e.key === ' ' || e.key === 'x') { dropBomb(); e.preventDefault(); }
  if (e.key === 'Escape') { if (scene === 'play' && ov.hidden) pause(); else if (scene === 'world') scene = 'worlds'; }
  if (e.key === 'Enter' && ov.hidden) { if (scene === 'world') startLevel(curWorld, nextIn(curWorld)); else if (scene === 'worlds') { curWorld = curWorldOf(); scene = 'world'; } }
});
addEventListener('keyup', e => { if (KEYS[e.key]) release(KEYS[e.key]); });

const toLogical = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };

addEventListener('pointerdown', e => {

  const k = Math.min(1, R / Math.max(1, Math.hypot(dx, dy)));
  knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  setJoyDir(Math.hypot(dx, dy) < 14 ? null : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));

addEventListener('blur', () => { held.length = 0; });
// iOS: çift dokunma ve iki parmakla yakınlaştırma kapalı (sayfa büyüyüp öyle kalmasın)
